// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
  
    dependencies {
        classpath('com.android.tools.build:gradle:8.8.2')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("de.undercouch:gradle-download-task:5.0.1")
        classpath('com.google.gms:google-services:4.4.2')
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        classpath 'com.google.firebase:perf-plugin:1.4.2'
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-inappbrowser-reborn declares androidx.annotation:annotation as a
// dynamic "1.5.+" range. Resolving a range requires Gradle to query a repo's
// version list (not just fetch a pinned artifact), and that lookup hits the
// legacy oss.sonatype.org snapshots host, which is unreliable/being
// decommissioned and frequently 504s. Every other module in this project already
// resolves this dependency to 1.6.0 via a constraint, so force that same version
// everywhere and skip the flaky range lookup entirely.
allprojects {
    configurations.all {
        resolutionStrategy {
            force "androidx.annotation:annotation:1.6.0"
        }
    }
}
