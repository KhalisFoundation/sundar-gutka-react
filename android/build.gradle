// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        // react-native-inappbrowser-reborn otherwise asks for dynamic ranges
        // (annotation 1.5.+, browser 1.4.+). Resolving a range lists versions
        // from the legacy oss.sonatype.org snapshots repo, which often 504s and
        // fails the build. It reads these two names instead, so it asks for
        // fixed versions; conflict resolution still picks the highest version
        // any other library requests, so nothing is downgraded.
        androidXAnnotation = "1.5.0"
        androidXBrowser = "1.4.0"
    }
    repositories {
        google()
        mavenCentral()
    }
  
    dependencies {
        classpath('com.android.tools.build:gradle:8.8.2')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("de.undercouch:gradle-download-task:5.0.1")
        classpath('com.google.gms:google-services:4.4.2')
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        classpath 'com.google.firebase:perf-plugin:1.4.2'
    }
}

apply plugin: "com.facebook.react.rootproject"
